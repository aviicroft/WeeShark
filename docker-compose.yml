version: "3.9"

services:
  weeshark:
    build: .
    container_name: weeshark
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist the SQLite database across redeploys
      - weeshark_db:/app/webguard
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Override if needed:
      # - PYTHON_BIN=python3

volumes:
  weeshark_db:
